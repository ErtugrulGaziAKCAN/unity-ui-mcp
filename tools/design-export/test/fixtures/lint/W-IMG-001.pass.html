<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}

body{margin:0}
.screen{display:flex;flex-direction:column;align-items:flex-start;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:20px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
img{display:block;flex-shrink:0}
.pic{width:80px;height:48px}
.tile{width:160px;height:96px;background-image:url("assets/blocks-80x48.png");background-size:80px 48px}
.big{width:120px;height:72px}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<p data-l10n="lint.sample.title" data-en="Title">Başlık</p>
<!-- every raster image is drawn at most at its pixel size at every declared viewport (a one-pixel image is a flat colour) -->
<img class="pic" src="assets/blocks-80x48.png">
<div class="tile"></div>
<img class="big" src="assets/logo.png">
</div></body></html>
