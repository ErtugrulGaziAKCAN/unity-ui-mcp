<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}

body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.card{position:relative;display:flex;flex-direction:row;justify-content:flex-end;width:200px;height:40px;background-color:#16c2d5}
.hit{position:absolute;left:0;top:0;width:200px;height:40px}
.icon{position:relative;width:20px;height:20px;background-color:#ffffff}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<p data-l10n="lint.sample.title" data-en="Title">Başlık</p>
<div class="card" data-u-id="card"><div class="hit" data-u-id="card-hit" data-u-action="open-card"></div><div class="icon" data-u-id="favourite" data-u-action="toggle-favourite"></div></div>
</div></body></html>
