<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}

body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:20px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.k{width:10px;height:10px;flex-shrink:0;background-color:#123c47;animation:nudge 1s linear infinite;transition:background-color 0.2s ease}
.k:hover{background-color:#16c2d5}
@keyframes nudge{from{translate:0 0}to{translate:0 2px}}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<p data-l10n="lint.sample.title" data-en="Title">Başlık</p>
<div class="k" data-u-id="k"></div>
</div></body></html>
