<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}

body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:20px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.rel{position:relative;z-index:2;width:10px;height:10px;flex-shrink:0}
.abs{position:absolute;left:0px;top:0px;z-index:-1;width:10px;height:10px}
.card{position:relative;display:block;width:200px;height:120px;flex-shrink:0;background-color:#123c47}
.badge{position:absolute;top:0px;right:0px;width:10px;height:10px;background-color:#ffffff}
.head{height:40px;background-color:#16c2d5}
.body{height:40px}
.img{height:60px;background-color:#16c2d5}
.overlay{position:absolute;left:0px;top:0px;right:0px;height:60px;background-color:#0b1f26}
.caption{position:relative;height:20px}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<p data-l10n="lint.sample.title" data-en="Title">Başlık</p>
<div class="card"><div class="badge"></div><div class="head"></div><div class="body"></div></div>
<div class="card"><div class="img"></div><div class="overlay"></div><div class="caption"></div></div>
<div class="rel"></div>
<div class="abs"></div>
</div></body></html>
