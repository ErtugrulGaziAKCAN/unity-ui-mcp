<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}

body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:20px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.card{width:200px;height:100px;flex-shrink:0;margin-bottom:32px;box-shadow:inset 0px 4px 0px rgba(255, 255, 255, 0.1), 0px 2px 4px rgba(0, 0, 0, 0.5);transition:transform 200ms ease}
.card:hover{box-shadow:0px 8px 16px rgba(0, 0, 0, 0.5);transform:translateY(-4px)}
.hero{width:400px;height:100px;flex-shrink:0;background-image:linear-gradient(90deg, #16c2d5, #0b1f26), radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.2), transparent 50%)}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<p data-l10n="lint.sample.title" data-en="Title">Başlık</p>
<div class="card" data-u-id="card"></div>
<div class="hero"></div>
</div></body></html>
