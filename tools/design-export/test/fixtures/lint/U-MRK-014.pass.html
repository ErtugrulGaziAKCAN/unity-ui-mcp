<!doctype html><html lang="en"><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}

body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
b{font-weight:700}
.field{appearance:none;border:0;padding:0;margin:0;background-color:#000000;color:#ffffff;font-family:"Inter UI";font-size:18px;line-height:22px;width:200px;height:20px}
.field::placeholder{color:#ffffff}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<p data-l10n="lint.sample.title" data-en="Title">Title</p>
<p data-l10n="lint.sample.note" data-en="Saved on Monday">Saved
  on   Monday</p>
<p data-l10n="lint.sample.greet" data-en="Hi {name}">Hi <span data-u-arg="name">Sam</span></p>
<p data-l10n="lint.sample.rich" data-en="Two lines
and bold">Two lines<br>and <b>bold</b></p>
<p data-l10n="lint.sample.distance" data-en="10&nbsp;km">10&nbsp;km</p>
<p data-l10n="lint.sample.plain">No data-en here: the text is the entry</p>
<p data-l10n="lint.sample.count">You have <span data-u-arg="count">3</span> messages</p>
<input class="field" data-u-id="search" placeholder="Search" data-l10n-placeholder="lint.sample.search" data-en-placeholder="Search">
<input class="field" data-u-id="lookup" placeholder="Find a player" data-l10n-placeholder="lint.sample.find">
</div></body></html>
