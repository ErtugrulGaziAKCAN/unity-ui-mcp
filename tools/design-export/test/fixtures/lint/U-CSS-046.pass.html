<!doctype html><html><head><meta charset="utf-8"><style>
:root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
*{box-sizing:border-box}
body{margin:0}
button{appearance:none;margin:0;padding:0;border:0;font:inherit;color:inherit;background-color:transparent}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.frame{display:flex;flex-direction:row;justify-content:center;width:2560px;height:400px}
.grid{display:flex;flex-direction:column;width:1764px;height:400px;padding:12px 16px;gap:8px;background-color:#123c47}
.cell{position:relative;left:10px;top:6px;width:200px;height:96px;margin:4px 0 0 -8px;padding:0.75rem 1.25rem;transform:translate(10px, 2px);background-color:#16c2d5}
.cell:hover{padding:16px 20px}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<div class="frame"><div class="grid"><div class="cell" data-u-id="cell" tabindex="0"></div><div class="cell"></div></div></div>
</div></body></html>
