<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:20px;color:#ffffff;background-color:#0b1f26;padding:24px;gap:12px}
p,h1,h2,ul,li{margin:0;padding:0}
ul{list-style:none}
a{color:inherit;text-decoration:none}
button{appearance:none;outline:0;border:0;background:none;font:inherit;color:inherit;padding:0;margin:0;cursor:pointer}
input{appearance:none;outline:0;border:0;background:none;font:inherit;color:inherit;padding:0;margin:0}
input::placeholder{color:#88a}
.row{display:flex;flex-direction:row;gap:8px;align-items:center}
.btn{display:flex;padding:8px 16px;border-radius:6px;background-color:#1d4;transition:background-color 150ms ease-out}
.btn:hover{background-color:#2e5}
.btn.is-active{background-color:#3f6}
.card{display:flex;flex-direction:column;border:1px solid rgb(255 255 255 / 20%);border-radius:8px;background:linear-gradient(180deg,#123,#234);box-shadow:0 2px 8px rgb(0 0 0 / 40%)}
.t{font-weight:700}
@media (min-width:1920px){.row{gap:12px}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.sp{animation:spin 1s linear infinite;width:16px;height:16px}
</style></head><body><div class="screen" data-u-screen="r">
<h1 class="t" data-u-id="title" data-l10n="r.title" data-en="Inbox">Gelen</h1>
<ul class="card" data-u-id="list"><li class="row" data-u-id="i1"><span data-l10n="r.a" data-en="A">A</span><a href="#" data-u-id="lnk" data-l10n="r.lnk" data-en="Link">Link</a></li></ul>
<div class="row"><button class="btn is-active" data-u-id="b1" data-u-action="open-inbox" data-l10n="r.b" data-en="Open">Aç</button>
<input type="text" data-u-id="in" data-u-bind="player-name" placeholder="x" data-l10n-placeholder="r.ph" data-en-placeholder="Name"></div>
<svg width="16" height="16" viewBox="0 0 16 16" class="sp"><path d="M0 0L16 16" fill="none" stroke="#fff" stroke-width="2"/></svg>
</div></body></html>
