<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}

*,*::before,*::after{box-sizing:border-box} body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.chip{display:flex;flex-direction:row;align-items:center;flex-shrink:0;align-self:flex-start;height:22px;padding:0 8px;overflow:hidden;background-color:#123c47}
.loose{display:flex;flex-direction:row;align-items:center;flex-shrink:0;align-self:flex-start;height:16px;margin-top:16px;padding:0 8px;background-color:#123c47}
.cut{flex-shrink:0;align-self:flex-start;width:200px;height:22px;margin-top:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<div class="chip"><p data-l10n="lint.sample.chip" data-en="Today">Bugün</p></div>
<div class="loose"><p data-l10n="lint.sample.loose" data-en="Tomorrow">Yarın</p></div>
<p class="cut" data-l10n="lint.sample.cut" data-en="The rest of the season stays the same">Sezonun geri kalanında her şey aynı kalıyor</p>
</div></body></html>
