<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}

body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.rows{display:flex;flex-direction:column;flex-shrink:0}
.row{display:flex;flex-direction:row;height:24px;flex-shrink:0}
.hit{width:24px;height:24px;flex-shrink:0;background-color:#16c2d5}
.crest{width:24px;height:24px;flex-shrink:0;background-color:#ffffff}
.field{appearance:none;border:0;padding:0;margin:0;background-color:#000000;color:#ffffff;font-family:"Inter UI";font-size:18px;line-height:22px;width:200px;height:20px}
.field::placeholder{color:#ffffff}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<p data-l10n="lint.sample.title" data-en="Title">Başlık</p>
<p data-u-id="club" data-u-bind="club-name">Northbridge FC</p>
<div class="crest" data-u-id="crest" data-u-bind="club-crest"></div>
<p data-u-id="form" data-u-bind="form">WWDLW</p>
<div class="rows" data-u-id="rows"><div class="row" data-u-repeat="player" data-u-id="row"><p data-u-id="name" data-u-bind="player-name">A. Novak</p></div><div class="row" data-u-id="row"><p data-u-id="name" data-u-bind="player-name">Jean-Baptiste Okonkwo-Lindqvist</p></div><div class="row" data-u-id="row"><p data-u-id="name" data-u-bind="player-name">B. Kaya</p></div></div>
</div></body></html>
