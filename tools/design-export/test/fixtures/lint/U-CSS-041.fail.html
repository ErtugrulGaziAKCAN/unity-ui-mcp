<!doctype html><html><head><meta charset="utf-8"><style>
:root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
*{box-sizing:border-box}
body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:20px;color:#ffffff;background-color:#0b1f26}
.row{display:flex;flex-direction:row}
.card{width:320px;height:180px;flex-shrink:0;border-radius:12px;background-color:#123c47;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.card:hover{box-shadow:0 16px 40px rgba(0,0,0,0.5);translate:0 -4px}
.panel{width:400px;height:120px;background-color:#0f2a33}
</style></head>
<body><div class="screen" data-u-screen="lint.sample">
<div class="row"><div class="card" data-u-id="a"></div></div>
<div class="panel"></div>
</div></body></html>
