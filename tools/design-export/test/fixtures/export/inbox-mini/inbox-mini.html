<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:19.359375px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
img{flex-shrink:0}
.card{display:flex;flex-direction:row;width:300px;height:80px;flex-shrink:0;background-color:#123c47;border:1px solid #16c2d5}
.card:hover{background-color:#16c2d5}
.rows{display:flex;flex-direction:column;height:200px;flex-shrink:0;overflow-y:auto;row-gap:8px}
.row{display:flex;flex-direction:row;height:24px;flex-shrink:0;color:#ffffff}
.row.is-unread{color:#16c2d5}
</style></head><body><div class="screen" data-u-screen="inbox-mini">
<p data-u-id="title" data-l10n="inbox.title" data-en="Inbox">Gelen Kutusu</p>
<p data-u-id="club" data-u-bind="club">Kartal</p>
<img data-u-id="logo" src="assets/logo.png" width="64" height="32" data-l10n-alt="inbox.logo" data-en-alt="Logo" alt="Logo">
<div class="card" data-u-id="card"></div>
<div class="rows" data-u-id="rows">
<div class="row is-unread" data-u-repeat="mails" data-u-id="row"><p data-u-id="subject" data-u-bind="subject">Hos geldin</p></div>
<div class="row" data-u-id="row"><p data-u-id="subject" data-u-bind="subject">Fikstur</p></div>
</div>
</div></body></html>
