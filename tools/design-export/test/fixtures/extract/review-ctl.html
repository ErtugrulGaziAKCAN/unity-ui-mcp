<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}body{margin:0}.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:20px;color:#ffffff;background-color:#0b1f26}p{margin:0}
.b{display:flex;width:120px;height:40px;flex-shrink:0;appearance:none;padding:0;border:none;background-color:#123c47;color:#ffffff;font-family:"Inter UI";font-size:16px;font-weight:400;line-height:20px;text-align:center}
.b:disabled{background-color:#333333}
.c{width:20px;height:20px;flex-shrink:0;appearance:none;margin:0;border:none;background-color:#123c47;color:#ffffff}
.c:checked{background-color:#16c2d5}
.tf{width:200px;height:20px;flex-shrink:0;appearance:none;margin:0;padding:0;border:0;background-color:#123c47;color:#ffffff;font-family:"Inter UI";font-size:16px;font-weight:400;line-height:20px}
.tf::placeholder{color:#8899aa}
.row{display:flex;height:24px;flex-shrink:0}
.row.is-selected{background-color:#16c2d5}
.rows{display:flex;flex-direction:column;flex-shrink:0}
</style></head><body><div class="screen" data-u-screen="probe">
<button class="b" data-u-id="go" data-u-action="go" disabled data-l10n="probe.go" data-en="Go">Git</button>
<input class="c" type="checkbox" data-u-id="chk" data-u-action="chk" checked>
<input class="tf" type="email" data-u-id="mail" placeholder="E-posta" data-l10n-placeholder="probe.mail" data-en-placeholder="Email">
<p data-u-id="greet" data-l10n="probe.greet" data-en="Hi {name}">Selam <span data-u-arg="name">Ali</span></p>
<div class="rows" data-u-id="rows"><div class="row is-selected" data-u-repeat="items"><p data-u-id="rl" data-u-bind="label">One</p></div><div class="row"><p data-u-id="rl" data-u-bind="label">Two</p></div><div class="row is-selected"><p data-u-id="rl" data-u-bind="label">Three</p></div></div>
</div></body></html>
