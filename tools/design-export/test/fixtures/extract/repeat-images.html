<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}body{margin:0}*,*::before,*::after{box-sizing:border-box}.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
.logo{width:24px;height:16px;flex-shrink:0}
.rows{display:flex;flex-direction:column;flex-shrink:0}
.row{display:flex;flex-direction:row;align-items:center;height:48px;flex-shrink:0;background-color:#123c47}
.crest{width:32px;height:32px;flex-shrink:0}
.flag{width:24px;height:16px;flex-shrink:0;background-size:24px 16px;background-repeat:no-repeat}
.name{width:120px;flex-shrink:0}
.badges{display:flex;flex-direction:row;flex-shrink:0}
.badge{width:16px;height:16px;flex-shrink:0}
.list{display:flex;flex-direction:column;width:400px;height:96px;flex-shrink:0;overflow-y:auto}
.entry{display:flex;flex-direction:row;height:48px;flex-shrink:0}
</style></head><body><div class="screen" data-u-screen="repeat.images">
<img class="logo" data-u-id="logo" data-u-bind="logo" src="assets/crest-b.png">
<div class="rows" data-u-id="rows">
<div class="row" data-u-repeat="rows" data-u-id="row"><img class="crest" data-u-id="crest" data-u-bind="row.crest" src="assets/crest-a.png"><div class="flag" data-u-id="flag" data-u-bind="row.flag" style="background-image:url(assets/flag-a.png)"></div><span class="name" data-u-id="name" data-u-bind="row.name">Bir</span><div class="badges" data-u-id="badges"><img class="badge" data-u-repeat="badges" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-a.png"></div></div>
<div class="row" data-u-id="row"><img class="crest" data-u-id="crest" data-u-bind="row.crest" src="assets/crest-b.png"><div class="flag" data-u-id="flag" data-u-bind="row.flag" style="background-image:url(assets/flag-b.png)"></div><span class="name" data-u-id="name" data-u-bind="row.name">İki</span><div class="badges" data-u-id="badges"><img class="badge" data-u-repeat="badges" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-b.png"><img class="badge" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-a.png"></div></div>
<div class="row" data-u-id="row"><img class="crest" data-u-id="crest" data-u-bind="row.crest"><div class="flag" data-u-id="flag" data-u-bind="row.flag"></div><span class="name" data-u-id="name" data-u-bind="row.name">Üç</span><div class="badges" data-u-id="badges"></div></div>
<div class="row" data-u-id="row"><img class="crest" data-u-id="crest" data-u-bind="row.crest" src="assets/crest-a.png" hidden><div class="flag" data-u-id="flag" data-u-bind="row.flag" style="background-image:url(assets/flag-a.png)"></div><span class="name" data-u-id="name" data-u-bind="row.name">Dört</span><div class="badges" data-u-id="badges"><img class="badge" data-u-repeat="badges" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-b.png"></div></div>
<div class="row" data-u-id="row"><img class="crest" data-u-id="crest" data-u-bind="row.crest" src="assets/crest-c.svg"><div class="flag" data-u-id="flag" data-u-bind="row.flag" style="background-image:url(assets/flag-b.png)"></div><span class="name" data-u-id="name" data-u-bind="row.name">Beş</span><div class="badges" data-u-id="badges"><img class="badge" data-u-repeat="badges" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-a.png"></div></div>
</div>
<div class="list" data-u-id="list">
<div class="entry" data-u-repeat="entries" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-b.png"></div>
<div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-a.png"></div>
<div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-b.png"></div>
</div>
</div></body></html>
