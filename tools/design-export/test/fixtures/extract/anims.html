<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16.515625px;line-height:20px;color:#ffffff;background-color:#0b1f26}
.btn{width:100px;height:40px;flex-shrink:0;background-color:#123c47;transition:background-color 200ms cubic-bezier(0.4, 0, 0.2, 1) 50ms, opacity 0.3s steps(4)}
.btn:hover{background-color:#16c2d5}
.btn:active{opacity:0.5;transition:opacity 100ms linear}
.spin{width:20px;height:20px;flex-shrink:0;animation:spin 1s ease-in 200ms infinite alternate both}
.state-loading .spin{opacity:0.5;transition:opacity 0.4s ease}
@keyframes spin{from{transform:rotate(0deg)} 50%{transform:rotate(180deg);animation-timing-function:linear} to{transform:rotate(360deg)}}
</style></head><body><div class="screen" data-u-screen="anims">
<button class="btn" data-u-id="btn" data-u-action="go" style="appearance:none;border:0;padding:0;margin:0"></button>
<div class="spin" data-u-id="spin"></div>
</div></body></html>
