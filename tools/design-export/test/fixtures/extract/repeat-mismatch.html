<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
.screen{display:flex;flex-direction:column;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16px;line-height:20px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.rows{display:flex;flex-direction:column;height:400px;flex-shrink:0;overflow-y:auto;row-gap:8px}
.row{display:flex;flex-direction:row;height:24px;flex-shrink:0;column-gap:4px}
.chips{display:flex;flex-direction:row;flex-shrink:0}
.chip{width:8px;height:8px;flex-shrink:0;background-color:#16c2d5}
</style></head><body><div class="screen" data-u-screen="squad">
<p data-u-id="club" data-u-bind="club">Kartal</p>
<div class="rows" data-u-id="rows">
<div class="row" data-u-repeat="players" data-u-id="row"><p data-u-id="name" data-u-bind="name">Ali</p><p data-u-id="age" data-u-bind="age">21</p><div class="chips" data-u-id="chips"><div class="chip" data-u-repeat="tags" data-u-id="chip" data-u-repeat-mode="inline"></div></div></div>
<div class="row" data-u-id="row"><p data-u-id="name" data-u-bind="name">Veli</p><div class="chips" data-u-id="chips"><div class="chip" data-u-repeat="tags" data-u-id="chip" data-u-repeat-mode="inline"></div><div class="chip" data-u-id="chip"></div></div></div>
<div class="row" data-u-id="row"><p data-u-id="name" data-u-bind="name">Ayşe</p><p data-u-id="age" data-u-bind="age">25</p><div class="chips" data-u-id="chips"><div class="chip" data-u-repeat="tags" data-u-id="chip" data-u-repeat-mode="inline"></div></div></div>
</div>
</div></body></html>
