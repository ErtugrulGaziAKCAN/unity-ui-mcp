<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}body{margin:0}
.screen{display:flex;flex-direction:column;align-items:flex-start;width:2560px;height:1440px;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
.panel{width:400px;height:200px;flex-shrink:0;background-color:#123c47;translate:-300px 0;transition:translate 200ms linear}
.panel.is-open{translate:0 0}
.menu{width:300px;height:100px;flex-shrink:0;background-color:#16c2d5}
.menu.is-open{animation:menu-in 100ms linear both}
@keyframes menu-in{from{translate:0 -40px}to{translate:0 0}}
</style></head><body><div class="screen" data-u-screen="initial-trigger">
<div class="panel is-open" data-u-id="panel"></div>
<div class="menu is-open" data-u-id="menu"></div>
</div></body></html>
