<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}body{margin:0}
@font-face{font-family:"Lazy";font-weight:700;src:url("/__kit/fonts/Inter_18pt-Bold.ttf") format("truetype")}
.screen{display:flex;flex-direction:column;align-items:flex-start;width:2560px;height:1440px;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
p{margin:0 0 8px 0;flex-shrink:0}
.chk{appearance:none;display:block;width:20px;height:20px;margin:0 0 8px 0;padding:0;border:0;flex-shrink:0;background-color:#123c47}
.chk:checked{background-color:#16c2d5}
.off{appearance:none;display:block;width:40px;height:20px;margin:0 0 8px 0;padding:0;border:0;flex-shrink:0;background-color:#123c47}
.off:disabled{background-color:#ff0000}
.card{display:flex;flex-direction:column;width:300px;flex-shrink:0;margin-bottom:8px;background-color:#123c47}
.card.is-open .title{color:#ff0000}
.ref{font-weight:700}
.late{display:none;font-family:"Lazy";font-weight:700}
.state-late .late{display:block}
</style></head><body><div class="screen" data-u-screen="controls">
<input type="checkbox" class="chk" data-u-id="chk">
<button class="off" data-u-id="off" data-u-action="off"></button>
<div class="card" data-u-id="card"><p class="title" data-u-id="title" data-l10n="controls.title" data-en="Title">Başlık</p></div>
<p class="ref" data-u-id="ref" data-l10n="controls.ref" data-en="Lazy font">Geç yüklenen yazı</p>
<p class="late" data-u-id="late" data-l10n="controls.late" data-en="Lazy font">Geç yüklenen yazı</p>
</div></body></html>
