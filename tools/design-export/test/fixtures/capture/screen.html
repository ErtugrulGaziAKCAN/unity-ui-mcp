<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
.screen{display:flex;flex-direction:column;align-items:flex-start;width:2560px;height:1440px;position:relative;font-family:"Inter UI";font-size:16.515625px;line-height:20px;color:#ffffff;background-color:#0b1f26}
p{margin:0}
.box{width:100px;height:40px;flex-shrink:0;margin-bottom:8px;background-color:#123c47}
.state-loading .box{background-color:#ff00ff}
.btn{width:200px;height:40px;flex-shrink:0;margin:0 0 8px 0;padding:0;border:0;appearance:none;background-color:#123c47;transition:background-color 200ms linear}
.btn:hover{background-color:#16c2d5}
.btn:active{opacity:0.5}
.go{width:120px;height:40px;flex-shrink:0;margin:0 0 8px 0;padding:0;border:0;appearance:none;background-color:#123c47}
.go:focus{background-color:#ff0000}
.card{display:flex;flex-direction:column;width:300px;flex-shrink:0;margin-bottom:8px;padding:8px;background-color:#123c47}
.card:hover .title{color:#16c2d5}
.tab{width:40px;height:20px;flex-shrink:0;margin-bottom:8px;background-color:#123c47}
.tab.is-selected{background-color:#16c2d5}
.spinner{display:none;width:32px;height:32px;flex-shrink:0;background-color:#ffffff}
.state-loading .spinner{display:block}
.pulse{width:20px;height:20px;flex-shrink:0;margin-bottom:8px;background-color:#ffffff;animation:pulse 1000ms linear infinite}
@keyframes pulse{from{opacity:1}to{opacity:0.2}}
.wrap{width:120px;flex-shrink:0}
@media (max-width: 1919px){.box{width:80px}}
</style></head><body><div class="screen" data-u-screen="capture">
<div class="box" data-u-id="box"></div>
<button class="btn" data-u-id="btn" data-u-action="play"></button>
<button class="go" data-u-id="go" data-u-action="go"></button>
<div class="card" data-u-id="card"><p class="title" data-u-id="title" data-l10n="capture.title" data-en="Title">Başlık</p></div>
<div class="tab" data-u-id="tab"></div>
<div class="spinner" data-u-id="spinner"></div>
<div class="pulse" data-u-id="pulse"></div>
<p class="wrap" data-u-id="wrap" data-l10n="capture.wrap" data-en="One two three four five six seven eight">Bir iki üç dört beş altı yedi sekiz</p>
</div></body></html>
