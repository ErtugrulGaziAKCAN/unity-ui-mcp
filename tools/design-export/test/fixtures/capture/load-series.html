<!doctype html><html><head><meta charset="utf-8"><style>:root{-webkit-font-smoothing:antialiased}body{margin:0}
.screen{display:flex;flex-direction:column;align-items:flex-start;width:2560px;height:1440px;font-family:"Inter UI";font-size:18px;line-height:22px;color:#ffffff;background-color:#0b1f26}
.a,.b{width:100px;height:100px;flex-shrink:0;background-color:#16c2d5}
.a{animation:slide 400ms linear 0ms 1 normal both}
.b{animation:slide 200ms linear 100ms 1 normal none}
@keyframes slide{from{translate:0 0}to{translate:200px 0}}
</style></head><body><div class="screen" data-u-screen="load-series">
<div class="a" data-u-id="a"></div>
<div class="b" data-u-id="b"></div>
</div></body></html>
