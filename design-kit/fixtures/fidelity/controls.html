<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>fidelity.controls</title>
<style>
/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 16px; line-height: 20px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 12px; line-height: 16px; font-weight: 400; }
.text-caption-bold { font-size: 12px; line-height: 16px; font-weight: 700; }
.text-label { font-size: 16px; line-height: 20px; font-weight: 400; }
.text-label-bold { font-size: 16px; line-height: 20px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 32px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 32px; font-weight: 700; }
.text-subtitle { font-size: 32px; line-height: 40px; font-weight: 400; }
.text-subtitle-bold { font-size: 32px; line-height: 40px; font-weight: 700; }
.text-title { font-size: 36px; line-height: 48px; font-weight: 400; }
.text-title-bold { font-size: 36px; line-height: 48px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 60px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 60px; font-weight: 700; }
.text-display { font-size: 64px; line-height: 80px; font-weight: 400; }
.text-display-bold { font-size: 64px; line-height: 80px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: row; width: 2560px; height: 1440px; position: relative; padding: 48px; background-color: var(--color-surface-900); }
.column { display: flex; flex-direction: column; width: 720px; margin-right: 64px; }
.title { margin-bottom: 32px; }
.label { margin-bottom: 8px; color: var(--color-text-secondary); }
.input { width: 640px; height: 64px; padding: 0 16px; margin-bottom: 24px; border: 2px solid var(--color-line); border-radius: 8px; background-color: var(--color-surface-700); }
.input:focus { border-color: #9be9f2; }
.area { width: 640px; height: 144px; padding: 12px 16px; margin-bottom: 24px; border: 2px solid var(--color-line); border-radius: 8px; background-color: var(--color-surface-700); }
.area:focus { border-color: #9be9f2; }
.select { width: 640px; height: 64px; padding: 0 16px; margin-bottom: 24px; border: 2px solid var(--color-line); border-radius: 8px; background-color: var(--color-surface-700); }
.select:focus { border-color: #9be9f2; }
.option-row { display: flex; flex-direction: row; align-items: center; margin-bottom: 16px; }
.check { width: 40px; height: 40px; flex-shrink: 0; margin-right: 16px; border: 2px solid var(--color-line); border-radius: 8px; background-color: var(--color-surface-700); }
.check:checked { background-color: #16c2d5; border-color: #16c2d5; }
.radio { width: 40px; height: 40px; flex-shrink: 0; margin-right: 16px; border: 2px solid var(--color-line); border-radius: 20px; background-color: var(--color-surface-700); }
.radio:checked { border-width: 12px; border-color: #16c2d5; }
.button { display: flex; flex-direction: row; align-items: center; justify-content: center; width: 320px; height: 64px; margin-bottom: 24px; border-radius: 8px; background-color: #16c2d5; color: #06171c; }
.button:hover { background-color: #3fd3e3; }
.button:active { background-color: #0f9fb0; }
.link { margin-bottom: 24px; color: #16c2d5; }
.link:hover { color: #9be9f2; }
.scroll { display: flex; flex-direction: column; width: 720px; height: 560px; overflow-y: auto; border-radius: 16px; background-color: var(--color-surface-800); }
.scroll-row { display: flex; flex-direction: row; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0; padding: 0 24px; border-bottom: 2px solid var(--color-surface-900); }
.scroll-row:hover { background-color: var(--color-surface-700); }
.scroll-row.is-selected { background-color: #216372; }
.value { color: #3ccf7a; }
.hscroll { display: flex; flex-direction: row; width: 720px; height: 160px; margin-top: 24px; overflow-x: auto; border-radius: 16px; background-color: var(--color-surface-800); }
.hscroll-tile { width: 200px; height: 128px; flex-shrink: 0; margin: 16px 0 16px 16px; border-radius: 12px; background-color: var(--color-surface-600); }
</style>
</head>
<body>
<div class="screen" data-u-screen="fidelity.controls">
  <div class="column">
    <h1 class="title text-title-bold" data-l10n="fidelity.controls.title" data-en="Controls">Kontroller</h1>
    <span class="label text-label-bold" data-l10n="fidelity.controls.text" data-en="Text">Metin</span>
    <input type="text" class="input text-body" data-u-id="text" value="Düz yazı ğüşıöç" data-u-bind="text">
    <span class="label text-label-bold" data-l10n="fidelity.controls.password" data-en="Password">Parola</span>
    <input type="password" class="input text-body" data-u-id="password" value="parola12" data-u-bind="password">
    <span class="label text-label-bold" data-l10n="fidelity.controls.number" data-en="Number">Sayı</span>
    <input type="number" class="input text-body" data-u-id="number" value="42" data-u-bind="number">
    <span class="label text-label-bold" data-l10n="fidelity.controls.email" data-en="Email">E-posta</span>
    <input type="email" class="input text-body" data-u-id="email" placeholder="ad@ornek.com" data-l10n-placeholder="fidelity.controls.email-placeholder" data-en-placeholder="name@example.com">
    <span class="label text-label-bold" data-l10n="fidelity.controls.notes" data-en="Notes">Notlar</span>
    <textarea class="area text-body" data-u-id="notes" placeholder="Birkaç satır not" data-l10n-placeholder="fidelity.controls.notes-placeholder" data-en-placeholder="A few lines of notes"></textarea>
  </div>
  <div class="column">
    <span class="label text-label-bold" data-l10n="fidelity.controls.choice" data-en="Choice">Seçim</span>
    <select class="select text-body" data-u-id="choice">
      <option data-l10n="fidelity.controls.choice-a" data-en="First option">Birinci seçenek</option>
      <option data-l10n="fidelity.controls.choice-b" data-en="Second option" selected>İkinci seçenek</option>
      <option data-l10n="fidelity.controls.choice-c" data-en="Third option">Üçüncü seçenek</option>
    </select>
    <label class="option-row"><input type="checkbox" class="check" data-u-id="check-a" checked><span class="text-body" data-l10n="fidelity.controls.check-a" data-en="Checked box">İşaretli kutu</span></label>
    <label class="option-row"><input type="checkbox" class="check" data-u-id="check-b"><span class="text-body" data-l10n="fidelity.controls.check-b" data-en="Empty box">Boş kutu</span></label>
    <label class="option-row"><input type="radio" class="radio" name="side" data-u-id="radio-a" checked><span class="text-body" data-l10n="fidelity.controls.radio-a" data-en="Home">İç saha</span></label>
    <label class="option-row"><input type="radio" class="radio" name="side" data-u-id="radio-b"><span class="text-body" data-l10n="fidelity.controls.radio-b" data-en="Away">Deplasman</span></label>
    <button class="button text-body-bold" data-u-id="button" data-u-action="go" data-l10n="fidelity.controls.button" data-en="Continue">Devam et</button>
    <a class="link text-body-bold" data-u-id="link" data-u-action="open-help" data-l10n="fidelity.controls.link" data-en="Open help">Yardımı aç</a>
  </div>
  <div class="column">
    <div class="scroll" data-u-id="table">
      <div class="scroll-row is-selected" data-u-repeat="table-rows" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Kaleciler</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">3</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Defans</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">8</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Orta saha</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">7</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Forvet</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">5</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Gençler</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">6</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Kiralık</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">2</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Sakat</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">1</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Cezalı</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">0</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Transfer listesi</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">4</span></div>
      <div class="scroll-row" data-u-id="row" data-u-action="pick-row"><span class="text-body" data-u-id="name" data-u-bind="row.name">Altyapı</span><span class="value text-body-bold" data-u-id="count" data-u-bind="row.count">12</span></div>
    </div>
    <div class="hscroll" data-u-id="strip">
      <div class="hscroll-tile"></div><div class="hscroll-tile"></div><div class="hscroll-tile"></div><div class="hscroll-tile"></div><div class="hscroll-tile"></div>
    </div>
  </div>
</div>
</body>
</html>
