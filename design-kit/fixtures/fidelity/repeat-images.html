<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>fidelity.repeat-images</title>
<style>
/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 20px; line-height: 24px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 20px; line-height: 28px; font-weight: 400; }
.text-caption-bold { font-size: 20px; line-height: 28px; font-weight: 700; }
.text-label { font-size: 20px; line-height: 24px; font-weight: 400; }
.text-label-bold { font-size: 20px; line-height: 24px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 32px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 32px; font-weight: 700; }
.text-subtitle { font-size: 32px; line-height: 40px; font-weight: 400; }
.text-subtitle-bold { font-size: 32px; line-height: 40px; font-weight: 700; }
.text-title { font-size: 36px; line-height: 48px; font-weight: 400; }
.text-title-bold { font-size: 36px; line-height: 48px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 60px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 60px; font-weight: 700; }
.text-display { font-size: 64px; line-height: 80px; font-weight: 400; }
.text-display-bold { font-size: 64px; line-height: 80px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: column; width: 2560px; height: 1440px; position: relative; padding: 48px; background-color: var(--color-surface-900); }
.title { margin-bottom: 32px; }
.content { display: flex; flex-direction: row; align-items: flex-start; }
.clubs { display: flex; flex-direction: column; width: 1200px; flex-shrink: 0; margin-right: 48px; }
.club { display: flex; flex-direction: row; align-items: center; height: 96px; flex-shrink: 0; margin-bottom: 16px; padding: 0 24px; border-radius: 8px; background-color: var(--color-surface-700); }
.crest { width: 48px; height: 48px; flex-shrink: 0; margin-right: 24px; }
.club-name { width: 440px; flex-shrink: 0; }
.flag { width: 48px; height: 32px; flex-shrink: 0; margin-right: 24px; background-size: 48px 32px; background-repeat: no-repeat; }
.badges { display: flex; flex-direction: row; align-items: center; flex-shrink: 0; }
.badge { width: 32px; height: 32px; flex-shrink: 0; margin-right: 12px; }
.board { display: flex; flex-direction: column; width: 720px; height: 340px; flex-shrink: 0; overflow-y: auto; border-radius: 16px; background-color: var(--color-surface-800); }
.entry { display: flex; flex-direction: row; align-items: center; height: 68px; flex-shrink: 0; padding: 0 24px; border-bottom: 4px solid var(--color-surface-900); }
</style>
</head>
<body>
<div class="screen" data-u-screen="fidelity.repeat-images">
  <!-- bound images in repeat items: each written-out item shows its own <img> (crest), its own url() background image
       (flag) and the images of its nested repeat (badges); an item may show none (no source, or hidden by its markup).
       Pictures are two flat halves or four quadrants (another item's picture differs in structure, not only in colour), with
       as many pixels as 3840×2160 draws (lint W-IMG-001), the edges through the middle on whole device pixels at every
       exact viewport; the scaled viewports resample them (Unity and Chromium differently): each picture's own check judges
       that (decision D-125), not the narrow list beside the rows, whose SSIM they would lower (decision D-166) -->
  <h1 class="title text-title-bold" data-l10n="fidelity.repeat-images.title" data-en="Images in repeat items">Tekrar öğelerinde görseller</h1>
  <div class="content">
    <div class="clubs" data-u-id="clubs">
      <div class="club" data-u-repeat="clubs" data-u-id="club">
        <img class="crest" data-u-id="crest" data-u-bind="club.crest" src="assets/crest-teal-72x72.png">
        <span class="club-name text-body-bold" data-u-id="club-name" data-u-bind="club.name">Gümüş Martılar</span>
        <div class="flag" data-u-id="flag" data-u-bind="club.flag" style="background-image: url('assets/flag-halves-72x48.png')"></div>
        <div class="badges" data-u-id="badges"><img class="badge" data-u-repeat="badges" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-sky-48x48.png"><img class="badge" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-amber-48x48.png"></div>
      </div>
      <div class="club" data-u-id="club">
        <img class="crest" data-u-id="crest" data-u-bind="club.crest" src="assets/crest-coral-72x72.png">
        <span class="club-name text-body-bold" data-u-id="club-name" data-u-bind="club.name">Yeşil Vadi</span>
        <div class="flag" data-u-id="flag" data-u-bind="club.flag" style="background-image: url('assets/flag-stripes-72x48.png')"></div>
        <div class="badges" data-u-id="badges"><img class="badge" data-u-repeat="badges" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-coral-48x48.png"><img class="badge" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-sky-48x48.png"><img class="badge" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-amber-48x48.png"></div>
      </div>
      <div class="club" data-u-id="club">
        <img class="crest" data-u-id="crest" data-u-bind="club.crest" hidden>
        <span class="club-name text-body-bold" data-u-id="club-name" data-u-bind="club.name">Serbest</span>
        <div class="flag" data-u-id="flag" data-u-bind="club.flag"></div>
        <div class="badges" data-u-id="badges"></div>
      </div>
      <div class="club" data-u-id="club">
        <img class="crest" data-u-id="crest" data-u-bind="club.crest" src="assets/crest-green-72x72.png">
        <span class="club-name text-body-bold" data-u-id="club-name" data-u-bind="club.name">Kızıl Kaya</span>
        <div class="flag" data-u-id="flag" data-u-bind="club.flag" style="background-image: url('assets/flag-halves-72x48.png')"></div>
        <div class="badges" data-u-id="badges"><img class="badge" data-u-repeat="badges" data-u-id="badge" data-u-bind="badge.icon" src="assets/badge-amber-48x48.png"></div>
      </div>
    </div>
    <!-- a virtualized list (a repeat in a scroll area): five of its twelve rows show, the rest are bound as it scrolls -->
    <div class="board" data-u-id="board">
      <div class="entry" data-u-repeat="entries" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-green-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Mavi Kıyı</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-teal-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Ak Bulut</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" hidden><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Kara Rüzgâr</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-coral-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Gece Kuşları</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-teal-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Çam Ormanı</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-green-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Kum Fırtınası</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-coral-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Dağ Keçileri</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-teal-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Buz Kartalları</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" hidden><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Yalnız Kurt</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-green-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Tuz Gölü</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-coral-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Sis Dağı</span></div>
      <div class="entry" data-u-id="entry"><img class="crest" data-u-id="entry-crest" data-u-bind="entry.crest" src="assets/crest-teal-72x72.png"><span class="text-body" data-u-id="entry-name" data-u-bind="entry.name">Ay Işığı</span></div>
    </div>
  </div>
</div>
</body>
</html>
