/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 16px; line-height: 20px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 12px; line-height: 16px; font-weight: 400; }
.text-caption-bold { font-size: 12px; line-height: 16px; font-weight: 700; }
.text-label { font-size: 16px; line-height: 20px; font-weight: 400; }
.text-label-bold { font-size: 16px; line-height: 20px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 32px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 32px; font-weight: 700; }
.text-subtitle { font-size: 32px; line-height: 40px; font-weight: 400; }
.text-subtitle-bold { font-size: 32px; line-height: 40px; font-weight: 700; }
.text-title { font-size: 36px; line-height: 48px; font-weight: 400; }
.text-title-bold { font-size: 36px; line-height: 48px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 60px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 60px; font-weight: 700; }
.text-display { font-size: 64px; line-height: 80px; font-weight: 400; }
.text-display-bold { font-size: 64px; line-height: 80px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: column; width: 2560px; height: 1440px; position: relative; padding: 48px; background-color: var(--color-surface-900); }
.header { display: flex; flex-direction: row; align-items: center; height: 64px; flex-shrink: 0; margin-bottom: 32px; }

.nav { display: flex; flex-direction: row; align-items: center; flex-shrink: 0; }

.nav-btn:hover { background-color: var(--color-surface-600); }

.nav-btn:disabled { background-color: var(--color-disabled-surface); color: var(--color-disabled-text); }

.month-toggle.is-open { background-color: var(--color-surface-700); color: var(--color-accent); }
.tools { display: flex; flex-direction: row; align-items: center; flex-shrink: 0; margin-left: auto; }
.tool { display: flex; flex-direction: row; align-items: center; height: 64px; flex-shrink: 0; margin-left: 16px; padding: 0 20px; border: 4px solid var(--color-surface-700); border-radius: 8px; background-color: var(--color-surface-800); }
.tool:hover { background-color: var(--color-surface-700); }
.tool:focus { border-color: var(--color-focus); }

.events { display: flex; flex-direction: column; flex-shrink: 0; }

.card { display: flex; flex-direction: column; justify-content: center; height: 48px; flex-shrink: 0; margin-top: 4px; padding: 0 8px; border-left: 4px solid transparent; border-radius: 4px; background-color: var(--color-surface-700); text-align: left; }

.day.is-overflow .more { display: flex; }

.rows { display: flex; flex-direction: column; flex-shrink: 0; }
.row { display: flex; flex-direction: column; flex-shrink: 0; margin-bottom: 8px; border-radius: 8px; background-color: var(--color-surface-700); }
.row-head { display: flex; flex-direction: row; align-items: center; height: 72px; flex-shrink: 0; padding: 0 16px; border: 4px solid transparent; border-radius: 8px; text-align: left; }

.row-head:active { background-color: var(--color-surface-500); }

.row-details { display: none; flex-direction: column; flex-shrink: 0; padding: 0 16px 16px 96px; }

.row.is-expanded .row-head { color: var(--color-accent); }
.row-note { color: var(--color-text-secondary); }
.row-link { display: flex; flex-direction: row; align-items: center; align-self: flex-start; height: 48px; flex-shrink: 0; margin-top: 12px; padding: 0 16px; border: 4px solid transparent; border-radius: 8px; background-color: var(--color-surface-600); color: var(--color-accent); }
.row-link:hover { background-color: var(--color-surface-500); }
.row-link:active { background-color: var(--color-surface-800); }
.row-link:focus { border-color: var(--color-focus); }

.row-flag { display: flex; flex-direction: row; align-items: center; align-self: flex-start; height: 40px; flex-shrink: 0; margin: 0 16px 16px 96px; padding: 0 16px; border: 4px solid transparent; border-radius: 8px; background-color: var(--color-surface-600); color: var(--color-warning); }
.row-flag:hover { background-color: var(--color-surface-500); }
.drawer { display: flex; flex-direction: column; width: 0px; height: 480px; flex-shrink: 0; overflow: hidden; border-radius: 16px; background-color: var(--color-surface-800); }
