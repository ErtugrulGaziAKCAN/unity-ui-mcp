<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>fidelity.background-images</title>
<style>
/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 20px; line-height: 24px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 20px; line-height: 28px; font-weight: 400; }
.text-caption-bold { font-size: 20px; line-height: 28px; font-weight: 700; }
.text-label { font-size: 20px; line-height: 24px; font-weight: 400; }
.text-label-bold { font-size: 20px; line-height: 24px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 32px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 32px; font-weight: 700; }
.text-subtitle { font-size: 32px; line-height: 40px; font-weight: 400; }
.text-subtitle-bold { font-size: 32px; line-height: 40px; font-weight: 700; }
.text-title { font-size: 36px; line-height: 48px; font-weight: 400; }
.text-title-bold { font-size: 36px; line-height: 48px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 60px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 60px; font-weight: 700; }
.text-display { font-size: 64px; line-height: 80px; font-weight: 400; }
.text-display-bold { font-size: 64px; line-height: 80px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: column; width: 2560px; height: 1440px; position: relative; padding: 48px; background-color: var(--color-surface-900); }
.title { margin-bottom: 32px; }
.row { display: flex; flex-direction: row; align-items: flex-start; margin-bottom: 40px; }
.bg { flex-shrink: 0; width: 240px; height: 144px; margin-right: 40px; background-color: var(--color-surface-700); background-image: url("assets/tile-60x36.png"); background-size: 40px 24px; }
.odd { width: 228px; height: 136px; }
.big { width: 360px; height: 216px; }
.wide { width: 448px; height: 216px; }
.photo { background-image: url("assets/quadrants-640x360.png"); }
.photo-large { background-image: url("assets/quadrants-960x540.png"); }
.only { background-color: transparent; }
.size-cover { background-size: cover; background-repeat: no-repeat; }
.size-contain { background-size: contain; background-repeat: no-repeat; }
.size-px { background-size: 400px 224px; }
.size-pct { background-size: 150% 150%; }
.size-w { background-size: 480px auto; }
.rep-none { background-repeat: no-repeat; }
.rep-x { background-repeat: repeat-x; }
.rep-y { background-repeat: repeat-y; }
.rep-both { background-repeat: repeat; }
.rep-mixed { background-repeat: repeat no-repeat; }
.pos-center { background-position: center; }
.pos-right-bottom { background-position: right bottom; }
.pos-px { background-position: 20px 12px; }
.pos-pct { background-position: 75% 25%; }
.pos-offset { background-position: right 16px bottom 8px; }
.pos-repeat { background-position: 8px 4px; }
</style>
</head>
<body>
<div class="screen" data-u-screen="fidelity.background-images">
  <h1 class="title text-title-bold" data-l10n="fidelity.background-images.title" data-en="Background images">Arka plan görselleri</h1>
  <!-- background-size: the tile at its CSS size (40×24 px, a 60×36 px image: as many pixels as 3840×2160 draws, lint
       W-IMG-001); the photo (640×360 px, 960×540 px where it is drawn larger) covering, contained, at px, % and one length,
       never drawn larger than its pixels at any declared viewport; placed on whole pixels -->
  <div class="row">
    <div class="bg big"></div>
    <div class="bg big photo size-cover pos-center"></div>
    <div class="bg wide photo size-contain pos-center"></div>
    <div class="bg big photo size-px pos-center"></div>
    <div class="bg big photo photo-large size-pct"></div>
    <div class="bg big photo photo-large size-w rep-none"></div>
  </div>
  <!-- background-repeat of the tile: both axes, none, one axis, two values -->
  <div class="row">
    <div class="bg odd rep-both"></div>
    <div class="bg odd rep-none"></div>
    <div class="bg odd rep-x"></div>
    <div class="bg odd rep-y"></div>
    <div class="bg odd rep-mixed"></div>
  </div>
  <!-- background-position: keywords, px, %, edge offsets, a moved repeat -->
  <div class="row">
    <div class="bg rep-none pos-center"></div>
    <div class="bg rep-none pos-right-bottom"></div>
    <div class="bg rep-none pos-px"></div>
    <div class="bg rep-none pos-pct"></div>
    <div class="bg rep-none pos-offset"></div>
    <div class="bg odd pos-repeat"></div>
  </div>
  <!-- an element painted only by its background image -->
  <div class="row">
    <div class="bg only rep-none pos-center"></div>
    <div class="bg wide only photo size-contain pos-center"></div>
  </div>
</div>
</body>
</html>
