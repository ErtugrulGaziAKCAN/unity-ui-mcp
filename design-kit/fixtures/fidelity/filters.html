<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>fidelity.filters</title>
<!--
  One tile per CSS filter function that UI Toolkit 6.3 also offers (blur, contrast, grayscale, hue-rotate, invert,
  opacity, sepia), each on a coloured tile with text and on a gradient. Lint accepts a function only when kit.config.json
  filterFunctions lists it (U-CSS-015), and the list stays empty until a function passes this fixture in Unity. CSS
  functions UI Toolkit lacks (brightness, saturate, drop-shadow, url()) stay rejected with the U-CSS-015 fix.
-->
<style>
/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 16px; line-height: 20px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 12px; line-height: 16px; font-weight: 400; }
.text-caption-bold { font-size: 12px; line-height: 16px; font-weight: 700; }
.text-label { font-size: 16px; line-height: 20px; font-weight: 400; }
.text-label-bold { font-size: 16px; line-height: 20px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 32px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 32px; font-weight: 700; }
.text-subtitle { font-size: 32px; line-height: 40px; font-weight: 400; }
.text-subtitle-bold { font-size: 32px; line-height: 40px; font-weight: 700; }
.text-title { font-size: 36px; line-height: 48px; font-weight: 400; }
.text-title-bold { font-size: 36px; line-height: 48px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 60px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 60px; font-weight: 700; }
.text-display { font-size: 64px; line-height: 80px; font-weight: 400; }
.text-display-bold { font-size: 64px; line-height: 80px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: column; width: 2560px; height: 1440px; position: relative; padding: 48px; background-color: var(--color-surface-900); }
.title { margin-bottom: 32px; }
.row { display: flex; flex-direction: row; align-items: flex-start; margin-bottom: 48px; }
.tile { display: flex; flex-direction: column; justify-content: flex-end; width: 280px; height: 200px; flex-shrink: 0; margin-right: 40px; padding: 16px; border-radius: 16px; background-color: #16c2d5; }
.tile-gradient { background-image: linear-gradient(135deg, #f2b544 0%, #f0605d 50%, #16c2d5 100%); }
.tile-text { color: #06171c; }
.f-blur { filter: blur(4px); }
.f-contrast { filter: contrast(1.6); }
.f-grayscale { filter: grayscale(1); }
.f-hue { filter: hue-rotate(120deg); }
.f-invert { filter: invert(1); }
.f-opacity { filter: opacity(0.5); }
.f-sepia { filter: sepia(0.8); }
.f-chain { filter: grayscale(0.5) contrast(1.2) blur(2px); }
.f-hover:hover { filter: grayscale(1); }
</style>
</head>
<body>
<div class="screen" data-u-screen="fidelity.filters">
  <h1 class="title text-title-bold" data-l10n="fidelity.filters.title" data-en="Filters">Filtreler</h1>
  <div class="row">
    <div class="tile f-blur"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.blur" data-en="Blur">Bulanık</p></div>
    <div class="tile f-contrast"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.contrast" data-en="Contrast">Kontrast</p></div>
    <div class="tile f-grayscale"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.grayscale" data-en="Grayscale">Gri tonlama</p></div>
    <div class="tile f-hue"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.hue" data-en="Hue rotation">Renk döndürme</p></div>
    <div class="tile f-invert"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.invert" data-en="Invert">Ters çevir</p></div>
    <div class="tile f-opacity"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.opacity" data-en="Opacity">Saydamlık</p></div>
    <div class="tile f-sepia"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.sepia" data-en="Sepia">Sepya</p></div>
  </div>
  <div class="row">
    <div class="tile tile-gradient f-blur"></div>
    <div class="tile tile-gradient f-contrast"></div>
    <div class="tile tile-gradient f-grayscale"></div>
    <div class="tile tile-gradient f-hue"></div>
    <div class="tile tile-gradient f-invert"></div>
    <div class="tile tile-gradient f-opacity"></div>
    <div class="tile tile-gradient f-sepia"></div>
  </div>
  <div class="row">
    <div class="tile f-chain"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.chain" data-en="Chained filters">Zincir filtre</p></div>
    <div class="tile f-hover" data-u-id="hover-filter"><p class="tile-text text-body-bold" data-l10n="fidelity.filters.hover" data-en="Grayscale on hover">Üzerine gelince gri</p></div>
  </div>
</div>
</body>
</html>
