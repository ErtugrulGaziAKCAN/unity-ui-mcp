<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>fidelity.layout</title>
<style>
/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 16px; line-height: 20px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 12px; line-height: 16px; font-weight: 400; }
.text-caption-bold { font-size: 12px; line-height: 16px; font-weight: 700; }
.text-label { font-size: 16px; line-height: 20px; font-weight: 400; }
.text-label-bold { font-size: 16px; line-height: 20px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 32px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 32px; font-weight: 700; }
.text-subtitle { font-size: 32px; line-height: 40px; font-weight: 400; }
.text-subtitle-bold { font-size: 32px; line-height: 40px; font-weight: 700; }
.text-title { font-size: 36px; line-height: 48px; font-weight: 400; }
.text-title-bold { font-size: 36px; line-height: 48px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 60px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 60px; font-weight: 700; }
.text-display { font-size: 64px; line-height: 80px; font-weight: 400; }
.text-display-bold { font-size: 64px; line-height: 80px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: column; width: 2560px; height: 1440px; position: relative; padding: 32px; background-color: var(--color-surface-900); }
.title { margin-bottom: 24px; }
.band { display: flex; flex-direction: row; margin-bottom: 24px; }
.panel { display: flex; flex-direction: column; width: 600px; height: 280px; margin-right: 24px; padding: 16px; background-color: var(--color-surface-800); }
.box { width: 64px; height: 48px; flex-shrink: 0; background-color: var(--color-accent); }
.box-b { background-color: var(--color-positive); }
.box-c { background-color: var(--color-warning); }
.box-d { background-color: var(--color-negative); }
.row { display: flex; flex-direction: row; height: 64px; margin-bottom: 16px; background-color: var(--color-surface-700); }
.row-start { justify-content: flex-start; align-items: flex-start; }
.row-center { justify-content: center; align-items: center; }
.row-end { justify-content: flex-end; align-items: flex-end; }
.row-between { justify-content: space-between; align-items: stretch; }
.row-around { justify-content: space-around; align-items: center; }
.row-evenly { justify-content: space-evenly; align-items: center; }
.row-reverse { flex-direction: row-reverse; align-items: center; }
.row-gap { gap: 16px; align-items: center; }
.stretch-box { width: 64px; flex-shrink: 0; background-color: var(--color-accent); }
.col { display: flex; flex-direction: column; width: 160px; height: 248px; margin-right: 16px; background-color: var(--color-surface-700); }
.col-center { justify-content: center; align-items: center; }
.col-reverse { flex-direction: column-reverse; align-items: flex-end; }
.col-gap { gap: 8px; align-items: stretch; }
.col-gap .box { width: auto; }
.wrap { display: flex; flex-direction: row; flex-wrap: wrap; align-content: flex-start; width: 568px; height: 248px; background-color: var(--color-surface-700); }
.wrap .box { margin: 0 8px 8px 0; }
.grow { display: flex; flex-direction: row; width: 568px; height: 64px; margin-bottom: 16px; background-color: var(--color-surface-700); }
.grow-1 { flex-grow: 1; height: 64px; background-color: var(--color-accent); }
.grow-2 { flex-grow: 2; height: 64px; background-color: var(--color-positive); }
.basis { flex: 0 0 25%; height: 64px; background-color: var(--color-warning); }
.shrink-row { display: flex; flex-direction: row; width: 568px; height: 64px; margin-bottom: 16px; background-color: var(--color-surface-700); }
.shrink-a { width: 400px; min-width: 0; flex-shrink: 1; height: 64px; background-color: var(--color-accent); }
.shrink-b { width: 400px; min-width: 0; flex-shrink: 3; height: 64px; background-color: var(--color-negative); }
.sizes { display: flex; flex-direction: row; align-items: flex-start; width: 568px; height: 64px; background-color: var(--color-surface-700); }
.pct { width: 50%; height: 50%; flex-shrink: 0; background-color: var(--color-accent); }
.minmax { width: 40px; min-width: 96px; max-height: 32px; height: 64px; flex-shrink: 0; background-color: var(--color-positive); }
.ratio { width: 64px; aspect-ratio: 2 / 1; flex-shrink: 0; background-color: var(--color-warning); }
.stage { display: flex; flex-direction: column; width: 600px; height: 280px; margin-right: 24px; position: relative; background-color: var(--color-surface-800); }
.abs { position: absolute; width: 96px; height: 64px; }
.abs-tl { top: 16px; left: 16px; background-color: var(--color-accent); }
.abs-tr { top: 16px; right: 16px; background-color: var(--color-positive); }
.abs-bl { bottom: 16px; left: 16px; background-color: var(--color-warning); }
.abs-br { bottom: 16px; right: 16px; background-color: var(--color-negative); }
.abs-center { top: 108px; left: 252px; background-color: var(--color-surface-500); }
.abs-pct { top: 25%; left: 40%; width: 20%; height: 50%; background-color: rgba(255, 255, 255, 0.2); z-index: 2; }
.clip { display: flex; flex-direction: column; width: 600px; height: 280px; margin-right: 24px; overflow: hidden; position: relative; background-color: var(--color-surface-800); }
.clip-child { position: absolute; top: -40px; left: -40px; width: 240px; height: 160px; border-radius: 24px; background-color: var(--color-accent); }
.clip-child-2 { position: absolute; bottom: -60px; right: -60px; width: 200px; height: 200px; border-radius: 100px; background-color: var(--color-positive); }
.moves { display: flex; flex-direction: row; align-items: center; justify-content: space-around; width: 600px; height: 280px; background-color: var(--color-surface-800); }
.move { width: 96px; height: 96px; flex-shrink: 0; background-color: var(--color-accent); }
.move-translate { translate: 12px -20px; }
.move-rotate { rotate: 30deg; background-color: var(--color-positive); }
.move-scale { scale: 0.75; background-color: var(--color-warning); }
.move-all { transform: translate(8px, 8px) rotate(-15deg) scale(1.2); transform-origin: 0 0; background-color: var(--color-negative); }
.paddings { display: flex; flex-direction: column; width: 600px; height: 280px; margin-right: 24px; padding: 8px 32px 48px 16px; background-color: var(--color-surface-800); }
.paddings-inner { display: flex; flex-direction: row; flex-grow: 1; padding: 16px; background-color: var(--color-surface-700); }
.margins { width: 120px; height: 120px; flex-shrink: 0; margin: 8px 24px 0 40px; background-color: var(--color-accent); }
.label-x { color: var(--color-text-secondary); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="screen" data-u-screen="fidelity.layout">
  <h1 class="title text-title-bold" data-l10n="fidelity.layout.title" data-en="Layout">Yerleşim</h1>
  <div class="band">
    <div class="panel">
      <div class="row row-start"><div class="box"></div><div class="box box-b"></div></div>
      <div class="row row-center"><div class="box"></div><div class="box box-b"></div></div>
      <div class="row row-end"><div class="box"></div><div class="box box-b"></div></div>
    </div>
    <div class="panel">
      <div class="row row-between"><div class="stretch-box"></div><div class="box box-b"></div><div class="stretch-box"></div></div>
      <div class="row row-around"><div class="box"></div><div class="box box-b"></div><div class="box box-c"></div></div>
      <div class="row row-evenly"><div class="box"></div><div class="box box-b"></div><div class="box box-c"></div></div>
    </div>
    <div class="panel">
      <div class="row row-reverse"><div class="box"></div><div class="box box-b"></div><div class="box box-c"></div></div>
      <div class="row row-gap"><div class="box"></div><div class="box box-b"></div><div class="box box-c"></div><div class="box box-d"></div></div>
      <div class="sizes"><div class="pct"></div><div class="minmax"></div><div class="ratio"></div></div>
    </div>
    <div class="panel">
      <div class="grow"><div class="grow-1"></div><div class="grow-2"></div><div class="basis"></div></div>
      <div class="shrink-row"><div class="shrink-a"></div><div class="shrink-b"></div></div>
    </div>
  </div>
  <div class="band">
    <div class="panel" style="flex-direction: row;">
      <div class="col col-center"><div class="box"></div><div class="box box-b"></div></div>
      <div class="col col-reverse"><div class="box"></div><div class="box box-b"></div></div>
      <div class="col col-gap"><div class="box"></div><div class="box box-b"></div><div class="box box-c"></div></div>
    </div>
    <div class="panel">
      <div class="wrap">
        <div class="box"></div><div class="box box-b"></div><div class="box box-c"></div><div class="box box-d"></div>
        <div class="box"></div><div class="box box-b"></div><div class="box box-c"></div><div class="box box-d"></div>
        <div class="box"></div><div class="box box-b"></div><div class="box box-c"></div><div class="box box-d"></div>
      </div>
    </div>
    <div class="stage">
      <div class="abs abs-tl"></div>
      <div class="abs abs-tr"></div>
      <div class="abs abs-bl"></div>
      <div class="abs abs-br"></div>
      <div class="abs abs-center"></div>
      <div class="abs abs-pct"></div>
    </div>
    <div class="clip">
      <div class="clip-child"></div>
      <div class="clip-child-2"></div>
    </div>
  </div>
  <div class="band">
    <div class="moves">
      <div class="move move-translate"></div>
      <div class="move move-rotate"></div>
      <div class="move move-scale"></div>
      <div class="move move-all"></div>
    </div>
    <div class="paddings" style="margin-left: 24px;">
      <p class="label-x text-label" data-l10n="fidelity.layout.paddings" data-en="Padding on every side">Her kenarda dolgu</p>
      <div class="paddings-inner"><div class="margins"></div><div class="margins box-b"></div></div>
    </div>
  </div>
</div>
</body>
</html>
