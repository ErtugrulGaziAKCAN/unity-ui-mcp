<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>kit.dialog</title>
<style>
/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 16px; line-height: 20px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 12px; line-height: 15px; font-weight: 400; }
.text-caption-bold { font-size: 12px; line-height: 15px; font-weight: 700; }
.text-label { font-size: 16px; line-height: 20px; font-weight: 400; }
.text-label-bold { font-size: 16px; line-height: 20px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 30px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 30px; font-weight: 700; }
.text-subtitle { font-size: 28px; line-height: 35px; font-weight: 400; }
.text-subtitle-bold { font-size: 28px; line-height: 35px; font-weight: 700; }
.text-title { font-size: 32px; line-height: 36px; font-weight: 400; }
.text-title-bold { font-size: 32px; line-height: 36px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 54px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 54px; font-weight: 700; }
.text-display { font-size: 56px; line-height: 63px; font-weight: 400; }
.text-display-bold { font-size: 56px; line-height: 63px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: column; width: 2560px; height: 1440px; position: relative; padding: 64px; background-color: var(--color-surface-900); }
.heading { margin-bottom: 24px; }
.backdrop-text { width: 1280px; color: var(--color-text-secondary); }
.scrim { display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; width: 2560px; height: 1440px; background-color: var(--color-scrim); }
.dialog { display: flex; flex-direction: column; width: 800px; padding: 48px; border: 2px solid var(--color-line); border-radius: var(--radius-lg); background-color: var(--color-surface-800); box-shadow: var(--shadow-dialog); }
.dialog-title { margin-bottom: 16px; }
.dialog-text { margin-bottom: 48px; color: var(--color-text-secondary); }
.dialog-actions { display: flex; flex-direction: row; justify-content: flex-end; }
.dialog-saving { display: none; flex-direction: row; justify-content: flex-end; height: 64px; align-items: center; color: var(--color-text-secondary); }
.state-saving .dialog-actions { display: none; }
.state-saving .dialog-saving { display: flex; }
.btn { display: flex; flex-direction: row; align-items: center; justify-content: center; height: 64px; padding: 0 32px; margin-left: 24px; border: 2px solid transparent; border-radius: var(--radius-md); }
.btn:focus { border-color: var(--color-focus); }
.btn-primary { background-color: var(--color-accent); color: var(--color-on-accent); }
.btn-primary:hover { background-color: var(--color-accent-hover); }
.btn-primary:active { background-color: var(--color-accent-pressed); }
.btn-secondary { background-color: var(--color-surface-700); border-color: var(--color-line); }
.btn-secondary:hover { background-color: var(--color-surface-600); }
.btn-secondary:active { background-color: var(--color-surface-500); }
</style>
</head>
<body>
<div class="screen" data-u-screen="kit.dialog">
  <h1 class="heading text-headline-bold" data-l10n="kit.dialog.heading" data-en="Dialog">İletişim kutusu</h1>
  <p class="backdrop-text text-body" data-l10n="kit.dialog.backdrop" data-en="The screen behind the dialog stays visible under the scrim.">İletişim kutusunun arkasındaki ekran perdenin altında görünür kalır.</p>
  <div class="scrim" data-u-id="scrim">
    <div class="dialog" data-u-id="dialog">
      <h2 class="dialog-title text-title-bold" data-l10n="kit.dialog.title" data-en="Leave without saving?">Kaydetmeden çıkılsın mı?</h2>
      <p class="dialog-text text-body" data-l10n="kit.dialog.text" data-en="Changes to the line-up since the last save will be lost.">Son kayıttan sonra kadroda yapılan değişiklikler kaybolacak.</p>
      <div class="dialog-actions">
        <button class="btn btn-secondary text-body-bold" data-u-id="stay" data-u-action="stay" data-l10n="kit.dialog.stay" data-en="Stay">Kal</button>
        <button class="btn btn-primary text-body-bold" data-u-id="leave" data-u-action="leave" data-l10n="kit.dialog.leave" data-en="Leave">Çık</button>
      </div>
      <p class="dialog-saving text-body" data-u-state="saving" data-l10n="kit.dialog.saving" data-en="Saving…">Kaydediliyor…</p>
    </div>
  </div>
</div>
</body>
</html>
