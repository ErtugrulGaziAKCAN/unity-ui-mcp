<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>kit.button</title>
<style>
/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 16px; line-height: 20px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 12px; line-height: 16px; font-weight: 400; }
.text-caption-bold { font-size: 12px; line-height: 16px; font-weight: 700; }
.text-label { font-size: 16px; line-height: 20px; font-weight: 400; }
.text-label-bold { font-size: 16px; line-height: 20px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 32px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 32px; font-weight: 700; }
.text-subtitle { font-size: 32px; line-height: 40px; font-weight: 400; }
.text-subtitle-bold { font-size: 32px; line-height: 40px; font-weight: 700; }
.text-title { font-size: 36px; line-height: 48px; font-weight: 400; }
.text-title-bold { font-size: 36px; line-height: 48px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 60px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 60px; font-weight: 700; }
.text-display { font-size: 64px; line-height: 80px; font-weight: 400; }
.text-display-bold { font-size: 64px; line-height: 80px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: column; width: 2560px; height: 1440px; position: relative; padding: 64px; background-color: var(--color-surface-900); }
.heading { margin-bottom: 48px; }
.row { display: flex; flex-direction: row; align-items: center; margin-bottom: 32px; }
.btn { display: flex; flex-direction: row; align-items: center; justify-content: center; height: 64px; padding: 0 32px; margin-right: 24px; border: 2px solid transparent; border-radius: var(--radius-md); }
.btn:focus { border-color: var(--color-focus); }
.btn:disabled { opacity: 0.4; }
.btn-primary { background-color: var(--color-accent); color: var(--color-on-accent); }
.btn-primary:hover { background-color: var(--color-accent-hover); }
.btn-primary:active { background-color: var(--color-accent-pressed); }
.btn-secondary { background-color: var(--color-surface-700); border-color: var(--color-line); }
.btn-secondary:hover { background-color: var(--color-surface-600); }
.btn-secondary:active { background-color: var(--color-surface-500); }
.btn-ghost { background-color: transparent; color: var(--color-accent); }
.btn-ghost:hover { background-color: var(--color-surface-700); }
.btn-ghost:active { background-color: var(--color-surface-600); }
.btn-danger { background-color: var(--color-negative); color: var(--color-on-accent); }
.btn-danger:hover { background-color: var(--color-negative-hover); }
.btn-danger:active { background-color: var(--color-negative-pressed); }
.btn-small { height: 48px; padding: 0 24px; }
.btn-wide { width: 480px; }
</style>
</head>
<body>
<div class="screen" data-u-screen="kit.button">
  <h1 class="heading text-headline-bold" data-l10n="kit.button.heading" data-en="Buttons">Düğmeler</h1>
  <div class="row">
    <button class="btn btn-primary text-body-bold" data-u-id="primary" data-u-action="confirm" data-l10n="kit.button.confirm" data-en="Confirm">Onayla</button>
    <button class="btn btn-secondary text-body-bold" data-u-id="secondary" data-u-action="cancel" data-l10n="kit.button.cancel" data-en="Cancel">Vazgeç</button>
    <button class="btn btn-ghost text-body-bold" data-u-id="ghost" data-u-action="details" data-l10n="kit.button.details" data-en="Details">Ayrıntılar</button>
    <button class="btn btn-danger text-body-bold" data-u-id="danger" data-u-action="delete" data-l10n="kit.button.delete" data-en="Delete">Sil</button>
  </div>
  <div class="row">
    <button class="btn btn-primary btn-small text-label-bold" data-u-id="primary-small" data-u-action="save" data-l10n="kit.button.save" data-en="Save">Kaydet</button>
    <button class="btn btn-secondary btn-small text-label-bold" data-u-id="secondary-small" data-u-action="back" data-l10n="kit.button.back" data-en="Back">Geri</button>
    <button class="btn btn-primary btn-wide text-body-bold" data-u-id="primary-wide" data-u-action="start" data-l10n="kit.button.start" data-en="Start the season">Sezonu başlat</button>
  </div>
</div>
</body>
</html>
