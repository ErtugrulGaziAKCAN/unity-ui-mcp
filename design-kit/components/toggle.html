<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>kit.toggle</title>
<style>
/* kit-base: begin (design kit base stylesheet; copy it unchanged to the top of every screen's style) */
:root { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
body, div, span, p, h1, h2, h3, h4, h5, h6, ul, ol, li, a, label, section, header, footer, nav, main, aside, article, button, input, textarea, select, img, svg { margin: 0; padding: 0; border: 0; }
body { font-family: var(--font-ui); font-size: 16px; line-height: 20px; font-weight: 400; color: var(--color-text-primary); }
h1, h2, h3, h4, h5, h6 { font-size: inherit; line-height: inherit; font-weight: inherit; }
b, strong { font-weight: 700; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { appearance: none; background-color: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; font-weight: inherit; letter-spacing: inherit; word-spacing: inherit; text-align: inherit; }
textarea { resize: none; }
::placeholder { color: var(--color-text-muted); }
.text-caption { font-size: 12px; line-height: 16px; font-weight: 400; }
.text-caption-bold { font-size: 12px; line-height: 16px; font-weight: 700; }
.text-label { font-size: 16px; line-height: 20px; font-weight: 400; }
.text-label-bold { font-size: 16px; line-height: 20px; font-weight: 700; }
.text-body { font-size: 24px; line-height: 32px; font-weight: 400; }
.text-body-bold { font-size: 24px; line-height: 32px; font-weight: 700; }
.text-subtitle { font-size: 32px; line-height: 40px; font-weight: 400; }
.text-subtitle-bold { font-size: 32px; line-height: 40px; font-weight: 700; }
.text-title { font-size: 36px; line-height: 48px; font-weight: 400; }
.text-title-bold { font-size: 36px; line-height: 48px; font-weight: 700; }
.text-headline { font-size: 48px; line-height: 60px; font-weight: 400; }
.text-headline-bold { font-size: 48px; line-height: 60px; font-weight: 700; }
.text-display { font-size: 64px; line-height: 80px; font-weight: 400; }
.text-display-bold { font-size: 64px; line-height: 80px; font-weight: 700; }
/* kit-base: end */
.screen { display: flex; flex-direction: column; width: 2560px; height: 1440px; position: relative; padding: 64px; background-color: var(--color-surface-900); }
.heading { margin-bottom: 48px; }
.option { display: flex; flex-direction: row; align-items: center; margin-bottom: 24px; }
.option-text { margin-left: 16px; }
.check { width: 32px; height: 32px; flex-shrink: 0; border: 2px solid var(--color-line); border-radius: var(--radius-sm); background-color: var(--color-surface-700); }
.check:hover { border-color: var(--color-text-secondary); }
.check:focus { border-color: var(--color-focus); }
.check:checked { border-color: var(--color-accent); background-color: var(--color-accent); }
.check:disabled { opacity: 0.4; }
.radio { width: 32px; height: 32px; flex-shrink: 0; border: 2px solid var(--color-line); border-radius: 16px; background-color: var(--color-surface-700); }
.radio:hover { border-color: var(--color-text-secondary); }
.radio:focus { border-color: var(--color-focus); }
.radio:checked { border-width: 10px; border-color: var(--color-accent); background-color: var(--color-on-accent); }
.radio:disabled { opacity: 0.4; }
.switch { width: 64px; height: 32px; flex-shrink: 0; border-radius: 16px; background-color: var(--color-surface-600); background-image: radial-gradient(circle 12px at 16px 16px, #ffffff 10px, rgba(255, 255, 255, 0) 11px); }
.switch:hover { background-color: var(--color-surface-500); }
.switch:checked { background-color: var(--color-accent); background-image: radial-gradient(circle 12px at 48px 16px, #ffffff 10px, rgba(255, 255, 255, 0) 11px); }
.switch:disabled { opacity: 0.4; }
</style>
</head>
<body>
<div class="screen" data-u-screen="kit.toggle">
  <h1 class="heading text-headline-bold" data-l10n="kit.toggle.heading" data-en="Toggles">Seçim kutuları</h1>
  <label class="option">
    <input type="checkbox" class="check" data-u-id="notifications" checked>
    <span class="option-text text-body" data-l10n="kit.toggle.notifications" data-en="Show notifications">Bildirimleri göster</span>
  </label>
  <label class="option">
    <input type="checkbox" class="check" data-u-id="autosave">
    <span class="option-text text-body" data-l10n="kit.toggle.autosave" data-en="Save automatically">Otomatik kaydet</span>
  </label>
  <label class="option">
    <input type="radio" class="radio" name="speed" data-u-id="speed-normal" checked>
    <span class="option-text text-body" data-l10n="kit.toggle.speed-normal" data-en="Normal speed">Normal hız</span>
  </label>
  <label class="option">
    <input type="radio" class="radio" name="speed" data-u-id="speed-fast">
    <span class="option-text text-body" data-l10n="kit.toggle.speed-fast" data-en="Fast speed">Hızlı</span>
  </label>
  <label class="option">
    <input type="checkbox" class="switch" data-u-id="music" checked>
    <span class="option-text text-body" data-l10n="kit.toggle.music" data-en="Music">Müzik</span>
  </label>
  <label class="option">
    <input type="checkbox" class="switch" data-u-id="effects">
    <span class="option-text text-body" data-l10n="kit.toggle.effects" data-en="Sound effects">Ses efektleri</span>
  </label>
</div>
</body>
</html>
