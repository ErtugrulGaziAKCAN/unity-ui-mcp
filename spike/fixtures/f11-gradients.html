<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f11-gradients</title>
<!-- M0 spike fixture: linear and radial gradients (R8) -- no USS equivalent; Unity uses SVG backgrounds -->
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Bold.ttf") format("truetype"); }
/* Regular file only: weight 700 requests are synthesized (faux bold) by Chromium. */
@font-face { font-family: "InterRegularOnly"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0b1f26; font-family: "Inter", sans-serif; color: #e8f1f2; }
/* UI Toolkit defaults mirrored: column flex containers, relative position, shrink 1 */
div { display: flex; flex-direction: column; flex-shrink: 1; position: relative; }
div.tx { display: block; }
#root { width: 100%; height: 100%; background-color: #0b1f26; }
#root { padding: 40px; }
#f11-lin { flex-direction: row; flex-wrap: wrap; }
#f11-l90 { width: 400px; height: 200px; margin: 10px; background: linear-gradient(90deg, #1f8a70, #2c6fbb); }
#f11-l180 { width: 400px; height: 200px; margin: 10px; background: linear-gradient(180deg, #00e5ff, #0b1f26); }
#f11-l45 { width: 400px; height: 200px; margin: 10px; background: linear-gradient(45deg, #c0572b, #d4a017); }
#f11-l3 { width: 400px; height: 200px; margin: 10px; background: linear-gradient(90deg, #ff0000 0%, #00ff00 50%, #0000ff 100%); }
#f11-lalpha { width: 400px; height: 200px; margin: 10px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.8)); }
#f11-lhard { width: 400px; height: 200px; margin: 10px; background: linear-gradient(90deg, #1f8a70 0%, #1f8a70 50%, #2c6fbb 50%, #2c6fbb 100%); }
#f11-rad { flex-direction: row; flex-wrap: wrap; }
#f11-rcircle { width: 400px; height: 200px; margin: 10px; background: radial-gradient(circle at center, #00e5ff, #0b1f26); }
#f11-rellipse { width: 400px; height: 200px; margin: 10px; background: radial-gradient(ellipse at center, #d4a017, rgba(212,160,23,0)); }
#f11-roff { width: 400px; height: 200px; margin: 10px; background: radial-gradient(circle at 25% 25%, #8e44ad, #0b1f26 70%); }
</style>
</head>
<body>
<div id="root">
<div id="f11-lin">
<div id="f11-l90">

</div>
<div id="f11-l180">

</div>
<div id="f11-l45">

</div>
<div id="f11-l3">

</div>
<div id="f11-lalpha">

</div>
<div id="f11-lhard">

</div>
</div>
<div id="f11-rad">
<div id="f11-rcircle">

</div>
<div id="f11-rellipse">

</div>
<div id="f11-roff">

</div>
</div>
</div>
</body>
</html>
