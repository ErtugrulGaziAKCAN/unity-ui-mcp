<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f03-percent-auto-parent</title>
<!-- M0 spike fixture: percent sizes inside auto-sized parents (R1) -->
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Bold.ttf") format("truetype"); }
/* Regular file only: weight 700 requests are synthesized (faux bold) by Chromium. */
@font-face { font-family: "InterRegularOnly"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0b1f26; font-family: "Inter", sans-serif; color: #e8f1f2; }
/* UI Toolkit defaults mirrored: column flex containers, relative position, shrink 1 */
div { display: flex; flex-direction: column; flex-shrink: 1; position: relative; }
div.tx { display: block; }
#root { width: 100%; height: 100%; background-color: #0b1f26; }
#root { padding: 40px; }
#f03-wrap { flex-direction: row; align-items: flex-start; }
#f03-p1 { background-color: #14303a; padding: 10px; }
#f03-p1-fixed { width: 400px; height: 60px; background-color: #1f8a70; }
#f03-p1-pct { width: 50%; height: 60px; background-color: #2c6fbb; margin-top: 10px; }
#f03-p2 { background-color: #14303a; padding: 10px; margin-left: 40px; height: 300px; }
#f03-p2-fixed { width: 300px; height: 100px; background-color: #c0572b; }
#f03-p2-pcth { width: 150px; height: 50%; background-color: #8e44ad; margin-top: 10px; }
#f03-p3 { background-color: #14303a; padding: 10px; margin-left: 40px; flex-direction: row; }
#f03-p3-fixed { width: 200px; height: 80px; background-color: #d4a017; }
#f03-p3-pct { width: 25%; height: 40px; background-color: #00a5b8; }
#f03-p4 { width: 1000px; margin-top: 40px; background-color: #14303a; padding: 10px; }
#f03-p4-a { width: 60%; height: 60px; background-color: #1f8a70; }
#f03-p4-b { width: 30%; height: 60px; background-color: #2c6fbb; margin-top: 10px; margin-left: 5%; }
</style>
</head>
<body>
<div id="root">
<div id="f03-wrap">
<div id="f03-p1">
<div id="f03-p1-fixed">

</div>
<div id="f03-p1-pct">

</div>
</div>
<div id="f03-p2">
<div id="f03-p2-fixed">

</div>
<div id="f03-p2-pcth">

</div>
</div>
<div id="f03-p3">
<div id="f03-p3-fixed">

</div>
<div id="f03-p3-pct">

</div>
</div>
</div>
<div id="f03-p4">
<div id="f03-p4-a">

</div>
<div id="f03-p4-b">

</div>
</div>
</div>
</body>
</html>
