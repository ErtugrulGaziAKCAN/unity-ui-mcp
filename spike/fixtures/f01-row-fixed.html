<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f01-row-fixed</title>
<!-- M0 spike fixture: row with fixed-size children, margins, alignment (R1) -->
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Bold.ttf") format("truetype"); }
/* Regular file only: weight 700 requests are synthesized (faux bold) by Chromium. */
@font-face { font-family: "InterRegularOnly"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0b1f26; font-family: "Inter", sans-serif; color: #e8f1f2; }
/* UI Toolkit defaults mirrored: column flex containers, relative position, shrink 1 */
div { display: flex; flex-direction: column; flex-shrink: 1; position: relative; }
div.tx { display: block; }
#root { width: 100%; height: 100%; background-color: #0b1f26; }
#root { padding: 40px; }
#f01-row-a { flex-direction: row; height: 200px; background-color: #14303a; }
#f01-a1 { width: 300px; height: 100px; background-color: #1f8a70; }
#f01-a2 { width: 400px; height: 100px; background-color: #2c6fbb; margin: 20px; }
#f01-a3 { width: 500px; height: 150px; background-color: #c0572b; }
#f01-row-b { flex-direction: row; height: 200px; margin-top: 40px; align-items: center; justify-content: space-between; background-color: #14303a; }
#f01-b1 { width: 300px; height: 100px; background-color: #1f8a70; }
#f01-b2 { width: 400px; height: 60px; background-color: #2c6fbb; }
#f01-b3 { width: 500px; height: 150px; background-color: #c0572b; }
#f01-row-c { flex-direction: row; height: 200px; margin-top: 40px; align-items: flex-end; justify-content: center; background-color: #14303a; }
#f01-c1 { width: 300px; height: 100px; background-color: #1f8a70; }
#f01-c2 { width: 400px; height: 60px; background-color: #2c6fbb; }
#f01-row-d { flex-direction: row; margin-top: 40px; background-color: #14303a; }
#f01-d1 { width: 300px; height: auto; background-color: #1f8a70; align-self: stretch; min-height: 50px; }
#f01-d2 { width: 200px; height: 160px; background-color: #2c6fbb; }
</style>
</head>
<body>
<div id="root">
<div id="f01-row-a">
<div id="f01-a1">

</div>
<div id="f01-a2">

</div>
<div id="f01-a3">

</div>
</div>
<div id="f01-row-b">
<div id="f01-b1">

</div>
<div id="f01-b2">

</div>
<div id="f01-b3">

</div>
</div>
<div id="f01-row-c">
<div id="f01-c1">

</div>
<div id="f01-c2">

</div>
</div>
<div id="f01-row-d">
<div id="f01-d1">

</div>
<div id="f01-d2">

</div>
</div>
</div>
</body>
</html>
