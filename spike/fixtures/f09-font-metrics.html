<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f09-font-metrics</title>
<!-- M0 spike fixture: single-line line box height and baseline per size, line-height normal (R4) -->
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Bold.ttf") format("truetype"); }
/* Regular file only: weight 700 requests are synthesized (faux bold) by Chromium. */
@font-face { font-family: "InterRegularOnly"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0b1f26; font-family: "Inter", sans-serif; color: #e8f1f2; }
/* UI Toolkit defaults mirrored: column flex containers, relative position, shrink 1 */
div { display: flex; flex-direction: column; flex-shrink: 1; position: relative; }
div.tx { display: block; }
#root { width: 100%; height: 100%; background-color: #0b1f26; }
#root { padding: 40px; }
#f09-12 { font-size: 12px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-14 { font-size: 14px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-16 { font-size: 16px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-18 { font-size: 18px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-20 { font-size: 20px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-24 { font-size: 24px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-28 { font-size: 28px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-32 { font-size: 32px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-40 { font-size: 40px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-48 { font-size: 48px; line-height: normal; background-color: #14303a; width: 400px; margin-bottom: 10px; }
#f09-row { flex-direction: row; align-items: baseline; margin-top: 20px; }
#f09-bl-a { font-size: 16px; background-color: #14303a; }
#f09-bl-b { font-size: 48px; background-color: #14303a; margin-left: 20px; }
</style>
</head>
<body>
<div id="root">
<div id="f09-list">
<div id="f09-12" class="tx">Hxgy Wag</div>
<div id="f09-14" class="tx">Hxgy Wag</div>
<div id="f09-16" class="tx">Hxgy Wag</div>
<div id="f09-18" class="tx">Hxgy Wag</div>
<div id="f09-20" class="tx">Hxgy Wag</div>
<div id="f09-24" class="tx">Hxgy Wag</div>
<div id="f09-28" class="tx">Hxgy Wag</div>
<div id="f09-32" class="tx">Hxgy Wag</div>
<div id="f09-40" class="tx">Hxgy Wag</div>
<div id="f09-48" class="tx">Hxgy Wag</div>
</div>
<div id="f09-row">
<div id="f09-bl-a" class="tx">Hx</div>
<div id="f09-bl-b" class="tx">Hx</div>
</div>
</div>
</body>
</html>
