<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f06-wrap-margins</title>
<!-- M0 spike fixture: flex-wrap with item margins and mixed item sizes (R1) -->
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Bold.ttf") format("truetype"); }
/* Regular file only: weight 700 requests are synthesized (faux bold) by Chromium. */
@font-face { font-family: "InterRegularOnly"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0b1f26; font-family: "Inter", sans-serif; color: #e8f1f2; }
/* UI Toolkit defaults mirrored: column flex containers, relative position, shrink 1 */
div { display: flex; flex-direction: column; flex-shrink: 1; position: relative; }
div.tx { display: block; }
#root { width: 100%; height: 100%; background-color: #0b1f26; }
#root { padding: 40px; }
#f06-wrap { flex-direction: row; flex-wrap: wrap; align-content: flex-start; width: 1000px; background-color: #14303a; }
#f06-i1 { width: 300px; height: 100px; background-color: #1f8a70; margin: 10px; }
#f06-i2 { width: 300px; height: 100px; background-color: #2c6fbb; margin: 10px; }
#f06-i3 { width: 300px; height: 100px; background-color: #c0572b; margin: 10px; }
#f06-i4 { width: 300px; height: 100px; background-color: #8e44ad; margin: 10px; }
#f06-i5 { width: 300px; height: 100px; background-color: #d4a017; margin: 10px; }
#f06-i6 { width: 300px; height: 100px; background-color: #00a5b8; margin: 10px; }
#f06-i7 { width: 300px; height: 100px; background-color: #1f8a70; margin: 10px; }
#f06-i8 { width: 300px; height: 100px; background-color: #2c6fbb; margin: 10px; }
#f06-wrap2 { flex-direction: row; flex-wrap: wrap; align-content: flex-start; align-items: flex-start; width: 900px; height: 600px; margin-top: 40px; background-color: #14303a; }
#f06-j1 { width: 200px; height: 80px; background-color: #1f8a70; margin: 15px 5px; }
#f06-j2 { width: 220px; height: 100px; background-color: #2c6fbb; margin: 5px 15px; }
#f06-j3 { width: 240px; height: 120px; background-color: #c0572b; margin: 15px 5px; }
#f06-j4 { width: 260px; height: 80px; background-color: #8e44ad; margin: 5px 15px; }
#f06-j5 { width: 280px; height: 100px; background-color: #d4a017; margin: 15px 5px; }
#f06-j6 { width: 300px; height: 120px; background-color: #00a5b8; margin: 5px 15px; }
</style>
</head>
