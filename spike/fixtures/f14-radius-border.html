<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f14-radius-border</title>
<!-- M0 spike fixture: border-radius and borders: uniform, per-side, per-corner, circle, pill, dashed -->
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Bold.ttf") format("truetype"); }
/* Regular file only: weight 700 requests are synthesized (faux bold) by Chromium. */
@font-face { font-family: "InterRegularOnly"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0b1f26; font-family: "Inter", sans-serif; color: #e8f1f2; }
/* UI Toolkit defaults mirrored: column flex containers, relative position, shrink 1 */
div { display: flex; flex-direction: column; flex-shrink: 1; position: relative; }
div.tx { display: block; }
#root { width: 100%; height: 100%; background-color: #0b1f26; }
#root { padding: 40px; }
#f14-grid { flex-direction: row; flex-wrap: wrap; }
#f14-uniform { width: 300px; height: 180px; margin: 20px; background-color: #1b4a56; border-radius: 24px; border-width: 4px; border-style: solid; border-color: #00e5ff; }
#f14-sides { width: 300px; height: 180px; margin: 20px; background-color: #1b4a56; border-top-width: 2px; border-right-width: 6px; border-bottom-width: 10px; border-left-width: 14px; border-style: solid; border-top-color: #ff0000; border-right-color: #00ff00; border-bottom-color: #0000ff; border-left-color: #ffff00; }
#f14-corners { width: 300px; height: 180px; margin: 20px; background-color: #1b4a56; border-top-left-radius: 60px; border-top-right-radius: 10px; border-bottom-right-radius: 30px; border-bottom-left-radius: 0px; border-width: 3px; border-style: solid; border-color: #ffffff; }
#f14-circle { width: 200px; height: 200px; margin: 20px; background-color: #1b4a56; border-radius: 50%; border-width: 6px; border-style: solid; border-color: #d4a017; }
#f14-pill { width: 300px; height: 80px; margin: 20px; background-color: #1b4a56; border-radius: 9999px; border-width: 2px; border-style: solid; border-color: #8e44ad; }
#f14-radius-noborder { width: 300px; height: 180px; margin: 20px; background-color: #1b4a56; border-radius: 40px; }
#f14-dashed { width: 300px; height: 180px; margin: 20px; background-color: #1b4a56; border-width: 4px; border-style: dashed; border-color: #00e5ff; }
#f14-clip { width: 300px; height: 180px; margin: 20px; background-color: #1b4a56; border-radius: 40px; overflow: hidden; }
#f14-clip-child { width: 200px; height: 120px; background-color: #c0572b; margin-left: -20px; margin-top: -20px; }
</style>
</head>
<body>
<div id="root">
<div id="f14-grid">
<div id="f14-uniform">

</div>
<div id="f14-sides">

</div>
<div id="f14-corners">

</div>
<div id="f14-circle">

</div>
<div id="f14-pill">

</div>
<div id="f14-radius-noborder">

</div>
<div id="f14-dashed">

</div>
<div id="f14-clip">
<div id="f14-clip-child">

</div>
</div>
</div>
</div>
</body>
</html>
