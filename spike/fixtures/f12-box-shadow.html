<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f12-box-shadow</title>
<!-- M0 spike fixture: box-shadow variants (bake check); compiler bakes to 9-slice assets -->
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Bold.ttf") format("truetype"); }
/* Regular file only: weight 700 requests are synthesized (faux bold) by Chromium. */
@font-face { font-family: "InterRegularOnly"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0b1f26; font-family: "Inter", sans-serif; color: #e8f1f2; }
/* UI Toolkit defaults mirrored: column flex containers, relative position, shrink 1 */
div { display: flex; flex-direction: column; flex-shrink: 1; position: relative; }
div.tx { display: block; }
#root { width: 100%; height: 100%; background-color: #0b1f26; }
#root { padding: 40px; }
#f12-grid { flex-direction: row; flex-wrap: wrap; }
#f12-soft { width: 300px; height: 180px; margin: 60px; background-color: #1b4a56; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
#f12-hard { width: 300px; height: 180px; margin: 60px; background-color: #1b4a56; box-shadow: 10px 10px 0 rgba(0,0,0,0.6); }
#f12-glow { width: 300px; height: 180px; margin: 60px; background-color: #1b4a56; box-shadow: 0 0 32px 4px rgba(0,229,255,0.6); }
#f12-radius { width: 300px; height: 180px; margin: 60px; background-color: #1b4a56; box-shadow: 0 12px 40px 8px rgba(0,0,0,0.6); border-radius: 32px; }
</style>
</head>
<body>
<div id="root">
<div id="f12-grid">
<div id="f12-soft">

</div>
<div id="f12-hard">

</div>
<div id="f12-glow">

</div>
<div id="f12-radius">

</div>
</div>
</div>
</body>
</html>
