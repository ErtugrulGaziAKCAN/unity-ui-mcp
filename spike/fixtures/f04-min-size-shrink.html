<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>f04-min-size-shrink</title>
<!-- M0 spike fixture: min-width under shrink, incl. min-width:auto text items (R1) -->
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Bold.ttf") format("truetype"); }
/* Regular file only: weight 700 requests are synthesized (faux bold) by Chromium. */
@font-face { font-family: "InterRegularOnly"; font-weight: 400; src: url("../../samples/FidelityProject/Assets/Fonts/Inter/Inter_18pt-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0b1f26; font-family: "Inter", sans-serif; color: #e8f1f2; }
/* UI Toolkit defaults mirrored: column flex containers, relative position, shrink 1 */
div { display: flex; flex-direction: column; flex-shrink: 1; position: relative; }
div.tx { display: block; }
#root { width: 100%; height: 100%; background-color: #0b1f26; }
#root { padding: 40px; }
#f04-row { flex-direction: row; width: 900px; height: 120px; background-color: #14303a; }
#f04-m1 { width: 400px; height: 100px; background-color: #1f8a70; min-width: 350px; }
#f04-m2 { width: 400px; height: 100px; background-color: #2c6fbb; min-width: 0px; }
#f04-m3 { width: 400px; height: 100px; background-color: #c0572b; }
#f04-m4 { width: 400px; height: 100px; background-color: #8e44ad; min-width: 0px; flex-shrink: 0; flex-basis: 100px; }
#f04-row2 { flex-direction: row; width: 600px; height: 120px; margin-top: 40px; background-color: #14303a; }
#f04-auto-text { background-color: #d4a017; font-size: 28px; min-width: auto; flex-shrink: 1; }
#f04-fill { width: 500px; height: 100px; background-color: #00a5b8; }
#f04-row3 { flex-direction: row; width: 500px; height: 120px; margin-top: 40px; background-color: #14303a; }
#f04-h1 { width: 300px; height: 40px; background-color: #1f8a70; min-height: 80px; }
#f04-h2 { width: 300px; height: 100px; background-color: #2c6fbb; max-width: 150px; }
</style>
</head>
<body>
<div id="root">
<div id="f04-row">
<div id="f04-m1">

</div>
<div id="f04-m2">

</div>
<div id="f04-m3">

</div>
<div id="f04-m4">

</div>
</div>
<div id="f04-row2">
<div id="f04-auto-text" class="tx">Unbreakable_Long_Word_Item</div>
<div id="f04-fill">

</div>
</div>
<div id="f04-row3">
<div id="f04-h1">

</div>
<div id="f04-h2">

</div>
</div>
</div>
</body>
</html>
